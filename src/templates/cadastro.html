<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Controle de Equipamentos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; display: flex; align-items: center; height: 100vh; }
        .signup-card { width: 100%; max-width: 450px; padding: 15px; margin: auto; }
    </style>
</head>
<body>

<div class="signup-card">
    <div class="card shadow-sm">
        <div class="card-body">
            <h3 class="text-center mb-4">Registrar Administrador</h3>
            
            {% with messages = get_flashed_messages() %}
              {% if messages %}
                {% for message in messages %}
                  <div class="alert alert-warning">{{ message }}</div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form action="{{ url_for('cadastro') }}" method="POST">
                <div class="mb-3">
                    <label class="form-label">Nome de Usuário</label>
                    <input type="text" name="username" class="form-control" placeholder="Ex: joao.ti" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Senha</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Departamento</label>
                    <select name="role" class="form-select" required>
                        <option value="" selected disabled>Selecione seu setor...</option>
                        <option value="RH">Recursos Humanos (RH)</option>
                        <option value="TI">Tecnologia da Informação (T.I)</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-success w-100">Criar Conta</button>
            </form>
            <hr>
            <p class="text-center mb-0">Já tem conta? <a href="{{ url_for('login') }}">Fazer Login</a></p>
        </div>
    </div>
</div>

</body>
</html>
